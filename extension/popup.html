<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NexGen Live Studio</title>
<link rel="stylesheet" href="popup.css">
<script defer src="popup.js"></script>
</head>
<body>
  <h1>Live Studio</h1>
  <p>Connect this Google Meet tab to the Windows app. Start or pause recording in Live Studio.</p>
  <form>
    <label for="code">Pairing code from Live Studio</label>
    <input id="code" name="code" type="password" autocomplete="off" required>
    <button type="submit">Connect this tab</button>
  </form>
  <button id="disconnect" type="button">Disconnect</button>
  <p id="status" role="status"></p>
</body>
</html>
